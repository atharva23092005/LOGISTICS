# NERA Risk Model Configuration — SIH 2025
# Disruption Prediction Architecture: XGBoost (Tabular) + LSTM (Temporal) + GNN (Spatial)

project:
  name: "NERA-Logistics-Risk-Intelligence"
  target_region: "Northeast India (8 States: AS, AR, MN, ML, MZ, NL, SK, TR)"
  modeling_grain: "ROAD_SEGMENT × DATE"
  target_label: "disruption_next_24h"
  alert_threshold: 0.70

temporal_split:
  train_years: [2007, 2008, 2009, 2010, 2011, 2012, 2013]
  val_years: [2014]
  test_years: [2015, 2016]

features:
  tabular:
    - rainfall_24h
    - rainfall_72h
    - rainfall_7d
    - rainfall_anomaly
    - elevation
    - slope
    - terrain_ruggedness
    - distance_to_river
    - land_cover
    - water_occurrence
    - historical_landslide_count
    - highway_class_encoded
    - bridge
    - road_length_m
    - month
    - monsoon_indicator

  temporal_sequence:
    seq_length_days: 14
    sequence_features:
      - rainfall_daily
      - rainfall_cumulative_3d
      - temperature_anomaly
      - soil_saturation_proxy

  graph:
    node_features:
      - elevation
      - slope
      - historical_incidents
    edge_features:
      - length_m
      - highway_class
      - current_risk_score

models:
  xgboost:
    n_estimators: 500
    learning_rate: 0.03
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight_auto: true
    eval_metric: "aucpr"

  lstm:
    input_dim: 4
    hidden_dim: 64
    num_layers: 2
    dropout: 0.2
    bidirectional: true
    learning_rate: 0.001
    batch_size: 32
    epochs: 30

  gnn:
    architecture: "GAT"  # Graph Attention Network
    in_channels: 3
    hidden_channels: 32
    out_channels: 16
    heads: 4
    learning_rate: 0.005
    epochs: 40

ensemble:
  method: "calibrated_weighted_average"
  weights:
    xgboost: 0.45
    lstm: 0.30
    gnn: 0.25
  calibration: "isotonic"
  export_formats:
    - "joblib"
    - "onnx"
    - "torchscript"
